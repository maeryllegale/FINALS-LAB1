<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's my grade?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- faint ruled "ledger" backdrop nakalagay sa case -->
    <div class="ledger-lines" aria-hidden="true"></div>

    <main class="card">
      <!-- small label above the title -->
      <p class="label">CCS114 | Finals Laboratory 1</p>

      <h1 class="title">What's my Grade?</h1>
      <p class="subtitle">Type your score below and find out.</p>

      <!-- Button that starts the alert / prompt / confirm sequence -->
      <button id="startBtn" class="btn">See my result</button>

      <!-- Divider between the intro and the result panel -->
      <hr class="rule" />

      <!-- Result panel: stays empty/placeholder until the script fills it in -->
      <section id="resultPanel" class="result">
        <p class="placeholder">Your result will show up here."</p>
      </section>
    </main>

    <!-- JavaScript file link -->
    <script src="script.js"></script>
  </body>
</html>
